name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

# Aucun droit par défaut : chaque job déclare uniquement ce dont il a besoin.
permissions: {}

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Lint & build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Validate HTML
        run: npm run lint:html

      - name: Forbid HTML injection APIs and inline code
        run: |
          if grep -rnE 'innerHTML|outerHTML|insertAdjacentHTML|document\.write|eval\(' src public; then
            echo "::error::Usage d'API d'injection HTML interdit"; exit 1
          fi
          if grep -nE '\son[a-z]+=|style="' ./*.html; then
            echo "::error::Handlers ou styles inline interdits (CSP)"; exit 1
          fi

      - name: Bundle with Vite
        run: npm run build

      - name: Check build output
        run: |
          for page in index terminal 404; do
            grep -q 'http-equiv="Content-Security-Policy"' "dist/$page.html" \
              || { echo "::error::CSP absente de $page.html"; exit 1; }
          done

      - name: Package bundle
        run: |
          BUNDLE="portfolio-${GITHUB_SHA::7}.tar.gz"
          tar -czf "$BUNDLE" -C dist .
          sha256sum "$BUNDLE" > SHA256SUMS
          {
            echo "### Bundle \`$BUNDLE\`"
            echo
            echo "| Fichier | Taille |"
            echo "|---|---|"
            find dist -type f -printf '| %P | %s o |\n' | sort
            echo
            echo "Archive : $(du -h "$BUNDLE" | cut -f1) — SHA-256 \`$(cut -d' ' -f1 SHA256SUMS)\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: portfolio-bundle-${{ github.sha }}
          path: |
            portfolio-*.tar.gz
            SHA256SUMS
          if-no-files-found: error
          retention-days: 14

      - name: Setup Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
