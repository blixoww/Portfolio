name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

# Aucun droit par défaut : chaque job déclare uniquement ce dont il a besoin.
permissions: {}

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate HTML
        run: npx --yes html-validate@11.16.2 index.html terminal.html 404.html

      - name: Check JSON
        run: python3 -m json.tool manifest.json > /dev/null

      - name: Forbid innerHTML and inline handlers
        run: |
          if grep -nE 'innerHTML|outerHTML|insertAdjacentHTML|document\.write|eval\(' js/*.js; then
            echo "::error::Usage d'API d'injection HTML interdit"; exit 1
          fi
          if grep -nE '\son[a-z]+=|style="' ./*.html; then
            echo "::error::Handlers ou styles inline interdits (CSP)"; exit 1
          fi

  build:
    name: Build
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Assemble site (fichiers publics uniquement)
        run: |
          mkdir -p _site
          cp -r index.html terminal.html 404.html manifest.json sitemap.xml assets css js _site/

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
